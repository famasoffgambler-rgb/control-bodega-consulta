<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Control de bodega</title>
<style>
:root{--bg:#f6f7f9;--card:#fff;--tx:#1b1f24;--mut:#6a737d;--bd:#dfe3e8;--ac:#1f3864;--acx:#fff;--chip:#e9edf3;--warn:#b45309;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#14171b;--card:#1d2127;--tx:#e8eaed;--mut:#9aa3ad;--bd:#2d333b;--ac:#7aa2f7;--acx:#10131a;--chip:#272d35;--warn:#f0b35a;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#14171b;--card:#1d2127;--tx:#e8eaed;--mut:#9aa3ad;--bd:#2d333b;--ac:#7aa2f7;--acx:#10131a;--chip:#272d35;--warn:#f0b35a;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:10}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding:12px 14px 10px;border-bottom:1px solid var(--bd)}
h1{font-size:18px;margin:0 0 8px}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
input,select{font:inherit;color:var(--tx);background:var(--card);border:1px solid var(--bd);border-radius:8px;padding:9px 10px;min-width:0}
#q{width:100%}
select{flex:1 1 90px}
.chips{display:flex;gap:6px}
.chip{flex:1;border:1px solid var(--bd);background:var(--chip);color:var(--tx);border-radius:8px;padding:8px 10px;font:inherit;cursor:pointer}
.chip.on{background:var(--ac);color:var(--acx);border-color:var(--ac)}
.sum{color:var(--mut);margin-top:8px;font-size:13px}
main{padding:12px 14px 28px}
.wrap{overflow-x:auto;background:var(--card);border:1px solid var(--bd);border-radius:10px}
table{border-collapse:collapse;width:100%;min-width:560px}
th,td{padding:8px 10px;text-align:left;border-bottom:1px solid var(--bd);white-space:nowrap}
td.n{white-space:normal}
th{font-size:12px;color:var(--mut);text-transform:uppercase;letter-spacing:.03em;position:sticky;top:0;background:var(--card)}
td.c,th.c{text-align:right}
.loc{font-weight:600}
.tag{font-size:11px;padding:2px 6px;border-radius:6px;background:var(--chip);color:var(--mut)}
.warn{color:var(--warn)}
.empty{padding:28px;text-align:center;color:var(--mut)}
.more{display:block;margin:12px auto 0;width:100%;max-width:260px}
</style>
</head>
<body>
<header>
<h1>📦 Control de bodega</h1>
<input id="q" type="search" placeholder="Buscar por código o nombre" autocomplete="off">
<div class="row">
<div class="chips" style="flex:1 1 100%">
<button class="chip on" data-m="">Todas</button>
<button class="chip" data-m="golden">Golden</button>
<button class="chip" data-m="birken">Birken</button>
</div>
<select id="rack" aria-label="Rack"><option value="">Todos los racks</option></select>
<select id="niv" aria-label="Nivel"><option value="">Todos los niveles</option><option>A</option><option>B</option><option>C</option><option>D</option></select>
</div>
<div class="sum" id="sum"></div>
</header>
<main>
<div class="wrap"><table>
<thead><tr><th>Ubicación</th><th>Marca</th><th>Código</th><th>Producto</th><th class="c">Pares</th></tr></thead>
<tbody id="tb"></tbody>
</table></div>
<button class="chip more" id="more" hidden>Ver más</button>
</main>

const $=id=>document.getElementById(id);
const norm=s=>String(s).normalize("NFD").replace(/[\u0300-\u036f]/g,"").toLowerCase();
const rows=D.map(r=>({m:r[0],r:r[1],n:r[2],c:r[3],p:r[4],q:r[5],k:norm(r[3]+" "+r[4])}));
const st={m:"",rack:"",niv:"",q:"",lim:150};
const racks=[...new Set(rows.map(x=>x.r))].sort((a,b)=>a-b);
$("rack").insertAdjacentHTML("beforeend",racks.map(r=>`<option value="${r}">Rack ${r}</option>`).join(""));
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function render(){
  const q=norm(st.q.trim()).split(/\s+/).filter(Boolean);
  const f=rows.filter(x=>(!st.m||x.m===st.m)&&(!st.rack||x.r==st.rack)&&(!st.niv||x.n===st.niv)&&q.every(t=>x.k.includes(t)));
  const pares=f.reduce((a,x)=>a+x.q,0);
  $("sum").textContent=f.length+" productos · "+pares+" pares";
  const shown=f.slice(0,st.lim);
  $("tb").innerHTML=shown.length?shown.map(x=>`<tr><td class="loc">R${x.r}-${x.n}</td><td><span class="tag">${x.m}</span></td><td>${esc(x.c)}</td><td class="n${x.p.startsWith("SIN NOMBRE")?" warn":""}">${esc(x.p)}</td><td class="c">${x.q}</td></tr>`).join(""):`<tr><td colspan="5" class="empty">Sin resultados</td></tr>`;
  $("more").hidden=f.length<=st.lim;
  $("more").textContent="Ver más ("+(f.length-st.lim)+" restantes)";
}
$("q").oninput=e=>{st.q=e.target.value;st.lim=150;render()};
$("rack").onchange=e=>{st.rack=e.target.value;st.lim=150;render()};
$("niv").onchange=e=>{st.niv=e.target.value;st.lim=150;render()};
document.querySelectorAll(".chip[data-m]").forEach(b=>b.onclick=()=>{
  document.querySelectorAll(".chip[data-m]").forEach(x=>x.classList.remove("on"));
  b.classList.add("on");st.m=b.dataset.m;st.lim=150;render()});
$("more").onclick=()=>{st.lim+=150;render()};
render();
</script>
